name: SLSA Build Provenance
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version: 22
      - name: Create package archive
        run: |
          set -euo pipefail
          npm pack --pack-destination dist
          test -n "$(find dist -maxdepth 1 -type f -name '*.tgz' -print -quit)"
      - name: Hash build artifact
        id: hash
        run: |
          set -euo pipefail
          echo "hashes=$(sha256sum dist/*.tgz | base64 -w0)" >> "$GITHUB_OUTPUT"
      - name: Retain build artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: aston-trust-infrastructure-package
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 30

  provenance:
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      private-repository: true
      upload-assets: false
