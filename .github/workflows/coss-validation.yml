name: ATI COSS validation
on:
  pull_request:
    paths:
      - "coss/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
  push:
    branches:
      - "feat/coss-integration-phase-1"
    paths:
      - "coss/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"

permissions:
  contents: read

concurrency:
  group: coss-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node tests and COSS validator tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run repository tests
        run: npm test
